<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Placeholder hero image</title>
  <desc id="desc">Temporary placeholder artwork for the site hero banner.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b3b2f"/>
      <stop offset="1" stop-color="#1f7a5a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7d56a" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="260" cy="230" r="170" fill="#0a2b23" opacity="0.55" filter="url(#soft)"/>
  <circle cx="1380" cy="690" r="220" fill="#0a2b23" opacity="0.45" filter="url(#soft)"/>
  <path d="M0 640 C 320 520, 520 760, 820 640 S 1380 520, 1600 620 L 1600 900 L 0 900 Z" fill="#05241d" opacity="0.45"/>
  <rect x="120" y="120" width="1360" height="660" rx="34" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.18)"/>
  <rect x="120" y="740" width="1360" height="40" rx="20" fill="url(#accent)" opacity="0.9"/>

  <g fill="#ffffff" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" text-anchor="middle">
    <text x="800" y="430" font-size="54" font-weight="650" opacity="0.98">Temporary Placeholder</text>
    <text x="800" y="490" font-size="22" opacity="0.85">Replace with your own licensed project photos</text>
    <text x="800" y="540" font-size="18" opacity="0.75">NE Portland Painters • Hero Banner</text>
  </g>
</svg>

