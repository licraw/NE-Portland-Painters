<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1050" viewBox="0 0 1400 1050" role="img" aria-labelledby="title desc">
  <title id="title">Cabinets and trim placeholder image</title>
  <desc id="desc">Temporary placeholder artwork for interior painting gallery.</desc>
  <defs>
    <linearGradient id="bg" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <radialGradient id="glow" cx="45%" cy="35%" r="60%">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1400" height="1050" fill="url(#bg)"/>
  <rect width="1400" height="1050" fill="url(#glow)"/>
  <rect x="120" y="140" width="1160" height="770" rx="28" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.16)"/>
  <g fill="#ffffff" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" text-anchor="middle">
    <text x="700" y="500" font-size="42" font-weight="650">Walls • Ceilings • Trim</text>
    <text x="700" y="555" font-size="20" opacity="0.85">Temporary placeholder</text>
  </g>
</svg>

